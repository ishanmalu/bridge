name: CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      # (The Mac runner can't grant Accessibility, so it runs the unit and end-to-end tests only.)

  # The Windows exe that ships. Built with MSVC so the WebView2 loader is linked in statically
  # (a MinGW build depends on WebView2Loader.dll, which PCs don't have).
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Only system DLLs
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          $dlls = & $dumpbin.FullName /dependents target\release\bridge.exe | Select-String '\.dll' | ForEach-Object { $_.ToString().Trim() }
          $dlls
          if ($dlls -match 'WebView2Loader|vcruntime|msvcp') { throw "bridge.exe depends on a DLL Windows doesn't ship" }
      - name: File details and manifest are embedded
        shell: pwsh
        run: |
          $v = (Get-Item target\release\bridge.exe).VersionInfo
          $v | Format-List CompanyName, ProductName, FileDescription, FileVersion, LegalCopyright
          if ($v.CompanyName -ne 'Ishan Malu' -or $v.ProductName -ne 'Bridge' -or -not $v.FileVersion) { throw "file details missing" }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter mt.exe | Where-Object FullName -like '*x64*' | Select-Object -First 1
          & $mt.FullName -nologo -inputresource:"target\release\bridge.exe;#1" -out:manifest.xml
          if (-not (Select-String -Path manifest.xml -Pattern 'asInvoker' -Quiet)) { throw "manifest missing" }
      - name: Self-test the release exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target\release\bridge.exe -ArgumentList selftest -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode) checks" }
      - name: Windows open and the page loads (from Program Files, like a real install)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:ProgramFiles\Bridge" | Out-Null
          Copy-Item target\release\bridge.exe "$env:ProgramFiles\Bridge\Bridge.exe"
          $p = Start-Process -FilePath "$env:ProgramFiles\Bridge\Bridge.exe" -ArgumentList uitest -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "uitest failed" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Bridge\WebView2")) { throw "webview data isn't in LOCALAPPDATA" }
          if (Test-Path "$env:ProgramFiles\Bridge\Bridge.exe.WebView2") { throw "webview wrote next to the exe" }
      - uses: actions/upload-artifact@v4
        with:
          name: Bridge-windows
          path: target/release/bridge.exe
